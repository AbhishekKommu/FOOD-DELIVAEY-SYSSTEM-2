<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — FoodHub</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><span class="logo-icon">🍔</span> FoodHub</a>
      <div class="nav-links" id="navLinks">
        <a href="/menu">Menu</a>
        <a href="/cart">Cart <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
        <a href="/orders">Orders</a>
        <a href="/admin" id="adminLink" style="display:none">Admin</a>
        <a href="/login" id="loginLink">Login</a>
        <a href="/register" id="registerLink">Register</a>
        <button class="btn-logout" id="logoutBtn" style="display:none">Logout</button>
        <span class="nav-user" id="navUser" style="display:none"></span>
      </div>
      <button class="nav-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <div class="page-header">
    <h1>Your Cart</h1>
    <p>Review your items and place your order</p>
  </div>

  <div class="cart-page">
    <div class="cart-items" id="cartItems">
      <div class="loading-spinner">Loading cart...</div>
    </div>
    <div class="cart-summary" id="cartSummary" style="display:none">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Delivery Fee</span>
        <span>$2.99</span>
      </div>
      <div class="summary-row summary-total">
        <span>Total</span>
        <span id="total">$0.00</span>
      </div>
      <div class="checkout-form">
        <h4>Delivery Details</h4>
        <div class="form-group">
          <label for="deliveryAddress">Delivery Address</label>
          <input type="text" id="deliveryAddress" placeholder="Enter your delivery address" />
        </div>
        <div class="form-group">
          <label for="phoneInput">Phone Number</label>
          <input type="tel" id="phoneInput" placeholder="Your phone number" />
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="checkoutBtn">Place Order</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 FoodHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/cart.js"></script>
</body>
</html>
